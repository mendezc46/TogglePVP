plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'eclipse'
}

version = '1.1.3'
group = 'com.justinm.togglepvp'

base { archivesName = 'togglepvp' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = '21.1.217'
    runs {
        client { client() }
        server { server() }
        data {
            data()
            programArguments.addAll '--mod', 'togglepvp', '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
    mods {
        togglepvp { sourceSet sourceSets.main }
    }
}

repositories { mavenCentral() }

dependencies {
    jarJar(implementation('org.yaml:snakeyaml:2.4'))
    additionalRuntimeClasspath 'org.yaml:snakeyaml:2.4'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest {
        attributes([
                'Specification-Title': 'togglepvp',
                'Specification-Vendor': 'JustinM',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'JustinM',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
